<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Videos</title>
  <style>
    :root{
      --bg: #f6f7fb;
      --card: #fff;
      --accent: #2563eb;
      --muted: #6b7280;
      --radius: 12px;
      --gap: 18px;
      font-family: "Noto Kufi Arabic", "Segoe UI", Roboto, sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:#0f172a;
      direction:rtl;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .page{
      max-width:1100px;
      margin:36px auto;
      padding:18px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }
    header h1{ margin:0; font-size:1.3rem; }
    .note{ color:var(--muted); font-size:0.95rem; }

    /* شبكة الفيديو */
    .videos-grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:var(--gap);
      align-items:start;
    }

    .video-card{
      background:var(--card);
      border-radius:var(--radius);
      padding:12px;
      box-shadow: 0 8px 26px rgba(2,6,23,0.06);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .video-wrap{
      width:100%;
      aspect-ratio: 16/9;
      overflow:hidden;
      border-radius:10px;
      background:#000;
      position:relative;
    }

    .video-wrap video,
    .video-wrap iframe{
      width:100%;
      height:100%;
      display:block;
      border:0;
      object-fit:cover;
    }

    .video-card h2{
      margin:0;
      font-size:1rem;
    }
    .desc{
      margin:0;
      color:var(--muted);
      font-size:0.9rem;
    }

    /* زر تشغيل كبير (للمظهر) */
    .play-big{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      background:rgba(0,0,0,0.45);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      display:flex;
      gap:8px;
      align-items:center;
      pointer-events:none; /* للتأكد إن الفيديو هو اللي يستلم النقر */
    }

    /* تجاوب */
    @media (max-width:900px){
      .videos-grid{ grid-template-columns: 1fr; }
      .page{ margin:18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>الفيديو </h1>
        
            
            
      </div>
      <a href="#" onclick="history.back();return false;" style="text-decoration:none;color:vsae(--muted)">◀ العوده للموقع </a>
    </header>

    <section class="videos-grid">
      <!-- بطاقة الفيديو الأول: ملف محلي -->
      <article class="video-card" aria-labelledby="v1title">
        <div class="video-wrap" role="region" aria-label="فيديو 1">
          <video id="video1" controls preload="metadata" poster="poster1.jpg">
            <source src="vv.mp4" type="video/mp4">
            متصفحك لا يدعم عنصر الفيديو.
          </video>
          <div class="play-big" aria-hidden="true">▶</div>
        </div>
            <h2 id="v1title">فيديو يدعم لغه الاشاره للحديث عن بعض معالم مصر </h2>
            <p class="desc"></p>
        </article>

        
           
    </section>
  </main>

  <!-- (اختياري) سكربت صغير يحسن تجربة اللمس: يزيل أي play overlay لو بدأ التشغيل -->
  <script>
    document.querySelectorAll('video').forEach(v=>{
      v.addEventListener('play', (e)=>{
        const big = v.parentElement.querySelector('.play-big');
        if(big) big.style.display = 'none';
      });
      v.addEventListener('pause', (e)=>{
        const big = v.parentElement.querySelector('.play-big');
        if(big) big.style.display = '';
      });
    });
  </script>
</body>
</html>
